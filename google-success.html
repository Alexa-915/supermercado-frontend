<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresando...</title>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #f6f8f5, #e8f5e9);
      margin: 0;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e8f5e9;
      border-top: 5px solid #6DAA43;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      color: #2c5e1a;
      margin: 0;
    }
    p {
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>¡Bienvenido!</h2>
    <p>Ingresando a tu cuenta...</p>
  </div>

  <script>
    // Obtener parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const clienteId = urlParams.get('id');
    const clienteNombre = urlParams.get('nombre');

    console.log('📦 Datos recibidos de Google:');
    console.log('   - ID:', clienteId);
    console.log('   - Nombre:', clienteNombre);

    if (clienteId && clienteNombre) {
      // ✅ Guardar en localStorage
      localStorage.setItem('clienteId', clienteId);
      localStorage.setItem('clienteNombre', clienteNombre);
      
      console.log('✅ Guardado en localStorage:');
      console.log('   - clienteId:', localStorage.getItem('clienteId'));
      console.log('   - clienteNombre:', localStorage.getItem('clienteNombre'));
      
      // Redirigir a inicio-usuarios.html después de 1 segundo
      setTimeout(() => {
        window.location.href = 'inicio-usuarios.html';
      }, 1000);
    } else {
      console.error('❌ Error: No se recibieron los datos');
      alert('Error al procesar el login. Intenta nuevamente.');
      window.location.href = 'iniciar-sesion.html';
    }
  </script>
</body>
</html>
